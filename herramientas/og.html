<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<title>og-image</title>
<style>
  @font-face{font-family:'Inter';src:url('../assets/fuentes/inter-400.woff2') format('woff2');font-weight:400;font-style:normal;}
  @font-face{font-family:'Inter';src:url('../assets/fuentes/inter-600.woff2') format('woff2');font-weight:600;font-style:normal;}
  html,body{margin:0;padding:0;}
  body{width:1200px;height:630px;overflow:hidden;background:#F6F7F9;
       font-family:'Inter',Helvetica,Arial,sans-serif;color:#101114;display:flex;}
  .texto{width:660px;padding:64px 56px 64px 64px;display:flex;flex-direction:column;justify-content:center;}
  .etiqueta{font-size:19px;font-weight:600;color:#1F4FB8;letter-spacing:.14em;text-transform:uppercase;margin:0 0 22px;}
  h1{font-size:84px;line-height:1;letter-spacing:-.045em;font-weight:600;margin:0 0 26px;}
  p{font-size:24px;line-height:1.4;color:#697077;margin:0 0 34px;max-width:520px;}
  .chip{align-self:flex-start;background:#3E7BFA;color:#fff;font-size:19px;font-weight:600;
        padding:14px 22px;border-radius:14px;}
  .foto{width:540px;height:630px;overflow:hidden;border-radius:14px 0 0 14px;box-shadow:0 1px 2px rgba(16,17,20,.05), 0 8px 24px rgba(16,17,20,.06);}
  .foto img{width:100%;height:100%;object-fit:cover;}
</style>
</head>
<body>
  <div class="texto">
    <p class="etiqueta">Zürich · Kreis 4</p>
    <h1>Zentraf Coffee</h1>
    <p>Espresso, Filterkaffee, Gipfeli und Kuchen — Kaffee zum Mitnehmen ab 07:00.</p>
    <span class="chip">Demo der Agentur Zentraf</span>
  </div>
  <div class="foto"><img src="../assets/img/hero-barista.jpg" alt=""></div>
</body>
</html>
